[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bridge-for-agents"
dynamic = ["version"]
description = "Answer Claude Code's questions and permission prompts from Telegram, over its HTTP hooks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Roman Marek", email = "marekr@bacil.net" }]
keywords = ["claude-code", "hooks", "telegram", "bot", "approvals", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
bridge-for-agents = "bridge_for_agents.cli:cli"
bridge-audit-verify = "bridge_for_agents.audit:main"
bridge-for-agents-mcp = "bridge_for_agents.mcp:main"

[project.urls]
Homepage = "https://github.com/spazyCZ/bridge-for-agents"
Repository = "https://github.com/spazyCZ/bridge-for-agents"
Issues = "https://github.com/spazyCZ/bridge-for-agents/issues"
Changelog = "https://github.com/spazyCZ/bridge-for-agents/blob/main/CHANGELOG.md"

[tool.hatch.version]
# Single source of truth. Duplicating it in pyproject.toml means a release
# workflow has to patch two files and can leave them disagreeing.
path = "src/bridge_for_agents/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge_for_agents"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
